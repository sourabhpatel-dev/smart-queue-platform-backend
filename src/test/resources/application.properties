# Shared test configuration (applies to every @SpringBootTest context).
#
# security.jwt.secret is REQUIRED by AuthProperties (fail fast when
# missing), so tests need a value without every test class repeating it.
# This key is synthetic, committed deliberately, and used ONLY by
# Testcontainers-backed tests against disposable databases - it signs no
# production token and protects nothing real.
#
# NOTE: this MUST stay application.properties, not application.yaml - a
# same-named application.yaml here shadows (replaces) the main one instead
# of merging in this Boot line, which silently drops datasource/JPA/Flyway
# settings (found via SmartQueuePlatformApplicationTests failing on driver
# resolution). Properties merge over YAML per Boot's documented ordering.
security.jwt.secret=phase-3f-test-only-jwt-signing-key-0123456789abcdef
